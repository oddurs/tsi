[package]
name = "tsiolkovsky"
version = "0.7.0"
edition = "2021"
rust-version = "1.87"
description = "Rocket staging optimization: the rocket equation, real engines, and optimal staging"
license = "MIT"
repository = "https://github.com/oddurs/tsi"
keywords = ["rocket", "space", "aerospace", "optimization"]
categories = ["command-line-utilities", "science", "simulation"]

[[bin]]
name = "tsi"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The `tsi` command-line tool. Library users can turn it off:
#   tsiolkovsky = { version = "0.8", default-features = false }
cli = ["dep:clap", "dep:clap_complete", "dep:clap_mangen", "dep:anyhow", "dep:serde_json"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
clap_complete = { version = "4", optional = true }
clap_mangen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = { version = "1", optional = true }
anyhow = { version = "1", optional = true }
thiserror = "2"
rand = "0.8"
rand_distr = "0.4"
rayon = "1"

[dev-dependencies]
serde_json = "1"
criterion = "0.5"
approx = "0.5"
assert_cmd = "2"
predicates = "3"
proptest = "1"

[[test]]
name = "cli"
required-features = ["cli"]

[[bench]]
name = "optimizer"
harness = false
