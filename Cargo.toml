[package]
name = "tsiolkovsky"
version = "0.7.0"
edition = "2021"
rust-version = "1.87"
description = "Rocket staging optimization: the rocket equation, real engines, and optimal staging"
license = "MIT"
repository = "https://github.com/oddurs/tsi"
keywords = ["rocket", "space", "aerospace", "optimization"]
categories = ["command-line-utilities", "science", "simulation"]

[[bin]]
name = "tsi"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
anyhow = "1"
thiserror = "2"
rand = "0.8"
rand_distr = "0.4"
rayon = "1"

[dev-dependencies]
criterion = "0.5"
approx = "0.5"
assert_cmd = "2"
predicates = "3"
proptest = "1"

[[bench]]
name = "optimizer"
harness = false
