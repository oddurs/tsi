name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

# A new push to a PR cancels its older run; main runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The PR title becomes the squash commit on main, so it follows the same
  # conventional-commit format the commit-msg hook enforces locally.
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|chore|refactor|perf|test|ci|build|style|revert)(\([a-z0-9._/-]+\))?!?: .+' || {
            echo "::error::PR title must be 'type(scope): summary', got: $TITLE"
            exit 1
          }

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - name: Clippy, library only
        run: cargo clippy --all-targets --no-default-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - run: cargo test --doc
      - name: Test the library without the CLI
        run: cargo test --no-default-features

  library:
    name: Library carries no CLI dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --no-default-features
      - name: No clap, anyhow or serde_json in the library's dependency tree
        run: |
          if cargo tree --no-default-features -e normal | grep -E 'clap|anyhow|serde_json'; then
            echo "the library pulled in a CLI dependency" >&2
            exit 1
          fi

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run every example against the library alone
        run: |
          for example in examples/*.rs; do
            name=$(basename "$example" .rs)
            echo "::group::$name"
            cargo run --release --no-default-features --example "$name"
            echo "::endgroup::"
          done

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps
      - run: cargo doc --no-deps --no-default-features

  msrv:
    name: MSRV (1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in step with `rust-version` in Cargo.toml
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  roadmap:
    name: Roadmap (cairn check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cairn-v0.2.2
      # The package is cairn-md; the binary it installs is cairn
      - run: cargo install --git https://github.com/oddurs/cairn --tag v0.2.2 --locked cairn-md
      - run: cairn check
      # ROADMAP.md is generated; fail if someone edited items without re-rendering
      - run: cairn render -q && git diff --exit-code ROADMAP.md

  # The one required check for branch protection: green only when every job
  # above passed (or was skipped, like the PR-title job on pushes to main).
  ci-ok:
    name: CI OK
    if: always()
    needs: [pr-title, fmt, clippy, test, library, examples, docs, msrv, roadmap]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
